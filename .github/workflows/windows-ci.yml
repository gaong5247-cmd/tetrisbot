name: Windows Rust build and regression tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test desktop vision, T-spin recovery and real TBP engine
        run: cargo test -p app --locked
      - name: Build updated executable
        run: cargo build -p app --release --locked
      - name: Package portable Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'package/engines', 'package/config' | Out-Null
          Copy-Item target/release/silhouette-tetris.exe package/SilhouetteTetris.exe
          Copy-Item engines/cold-clear-2.exe package/engines/cold-clear-2.exe
          Copy-Item config/default.toml package/config/default.toml
          Copy-Item -LiteralPath 'Start egui.cmd' -Destination 'package/Start egui.cmd'
          Copy-Item -LiteralPath 'Start Local Lab.cmd' -Destination 'package/Start Local Lab.cmd'
          Copy-Item README.md package/README.md
      - name: Upload runnable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SilhouetteTetris-Windows-x64
          path: package/
          retention-days: 14
