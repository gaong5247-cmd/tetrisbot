name: Windows Rust build and regression tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test desktop vision, T-spin recovery and real TBP engine
        run: cargo test -p app --locked
      - name: Build updated executable
        run: cargo build -p app --release --locked
