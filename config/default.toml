monitor = 0
capture_hz = 60
engine_path = "engines/cold-clear-2.exe"
engine_timeout_ms = 4500
verification_timeout_ms = 3500
allow_external = true
# Enable only in agreed multiplayer matches: permit verified bottom-injected
# garbage rises and replan around actual open holes.
multiplayer_attack_mode = false
# External games are allowed only after Start AI; target window must be foreground.

# Edit these to match your game's Settings -> Controls.
[controls]
# scancode (default) resembles physical key events; switch to virtual_key if a game ignores it.
input_method = "scan_code"
left = "Left"
right = "Right"
cw = "X"
ccw = "Z"
down = "Down"
hard_drop = "Space"

[detection]
stable_frames = 5
lock_score = 0.72
# A tracked board can have weaker contrast during line-clear animations.
retain_score = 0.55
# Do not lose the board on a few low-confidence frames; never send input
# while the board is temporarily unverified.
loss_grace_frames = 12
min_cell = 6
max_cell = 100
edge_threshold = 8
rescan_ms = 700

[movement]
pulse_ms = 42
# Hard drop gets a longer hold so polling-based games don't miss it.
hard_drop_ms = 65
gap_ms = 22
# estimated time spent capturing/verifying after each input (ms)
feedback_ms = 30
# 1=check each horizontal tap; 2=balanced fast default; 3=faster
# Final pre-hard-drop landing check is always mandatory.
horizontal_verify_stride = 2
das_ms = 150
arr_ms = 30
gravity_ms = 1000
lock_delay_ms = 500
max_nodes = 100000
guideline_srs = true
soft_drop_one_cell = true
